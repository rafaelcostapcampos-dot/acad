name: ACAD backend tests

on:
  push:
    branches:
      - feat/cloudflare-two-profiles
    paths:
      - 'frontend/cloudflare/**'
      - 'frontend/src/lib/acad-sync-engine*'
      - 'frontend/src/store/useStore.js'
      - 'frontend/src/views/Login.jsx'
      - 'frontend/src/App.jsx'
      - '.github/workflows/acad-api-tests.yml'
  pull_request:
    paths:
      - 'frontend/cloudflare/**'
      - '.github/workflows/acad-api-tests.yml'

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test profile API
        run: node --test frontend/cloudflare/worker.test.mjs frontend/src/lib/acad-sync-engine.test.mjs

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build original openGym
        run: npm run build
        working-directory: frontend
